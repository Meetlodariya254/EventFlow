version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "brace-expansion"
